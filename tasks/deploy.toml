#:schema https://mise.jdx.dev/schema/mise-task.json

# Deploying is a task like every other step: `main.yml` calls this, and an operator
# calls the same command for a manual deploy. The VPS never runs mise: the task runs
# where the SSH credentials are and streams `deploy/layout.env` + the remote half in.

["deploy:vps"]
description = "Deploy a published server image to the production VPS over SSH"
usage = """
arg "<image>" help="Image reference: ghcr.io/<owner>/friendarazzi-server:sha-<commit>"
arg "[revision]" help="Full commit the image was built from (defaults to the sha-<commit> tag)"
flag "--host <host>" env="VPS_HOST" help="VPS hostname"
flag "--user <user>" env="VPS_USER" help="VPS deploy account"
flag "--api-domain <domain>" env="API_DOMAIN" help="Optional API hostname check (defaults to API_DOMAIN in VPS .env)"
flag "--root <dir>" env="FRIENDARAZZI_HOST_ROOT" help="VPS host root directory (default from deploy/layout.env)"
flag "--identity <path>" env="VPS_SSH_IDENTITY" help="SSH private key (default ~/.ssh/id_ed25519)"
"""
run = "bash {{ vars.REPO_ROOT }}/tasks/scripts/deploy-vps.sh"
