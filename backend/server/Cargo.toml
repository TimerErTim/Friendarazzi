[package]
name = "friendarazzi-server"
version.workspace = true
edition.workspace = true
authors.workspace = true
license-file.workspace = true
repository.workspace = true

[dependencies]
friendarazzi-core = { path = "../../crates/friendarazzi-core" }
friendarazzi-sqlite = { path = "../../crates/friendarazzi-sqlite" }
friendarazzi-api = { path = "../../crates/friendarazzi-api" }
friendarazzi-filesystemstore = { path = "../../crates/friendarazzi-filesystemstore" }
friendarazzi-smtp = { path = "../../crates/friendarazzi-smtp" }

thiserror = { workspace = true }
error-stack = { workspace = true }

async-trait = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
toml = { workspace = true }

uuid = { workspace = true, features = ["v4", "serde"] }

base64 = { workspace = true }
poem = { workspace = true, features = ["compression", "requestid"] }
poem-openapi = { workspace = true }
tokio = { version = "1.0", features = ["full"] }
clap = { workspace = true, features = ["derive", "env"] }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
tracing-appender = { workspace = true }
tracing-opentelemetry = { workspace = true }
opentelemetry = { workspace = true }
opentelemetry_sdk = { workspace = true }
opentelemetry-otlp = { workspace = true }

[dev-dependencies]
test-log = { workspace = true }
tempdir = "0.3.7"

[lints]
workspace = true
