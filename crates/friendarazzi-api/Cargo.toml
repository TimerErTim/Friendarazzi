[package]
name = "friendarazzi-api"
description = "API for friendarazzi.app"
version.workspace = true
authors.workspace = true
license-file.workspace = true
edition.workspace = true
repository.workspace = true

[dependencies]
friendarazzi-core = { path = "../friendarazzi-core" }

thiserror = { workspace = true }
error-stack = { workspace = true }
tracing = { workspace = true }

async-trait = { workspace = true }
sha2 = { workspace = true }
hex = { workspace = true }

uuid = { workspace = true }
chrono = { workspace = true }
http = { workspace = true }
base64 = { workspace = true }
serde_json = { workspace = true }

poem-openapi = { workspace = true, features = ["uuid", "chrono", "rust_decimal", "swagger-ui", "redoc", "cookie"], optional = true }
poem = { workspace = true, optional = true }
futures = { workspace = true, optional = true }
tokio = { workspace = true, features = ["rt"], optional = true }
serde = { workspace = true, features = ["derive"] }

[features]
default = ["openapi"]
openapi = ["dep:poem-openapi", "dep:poem", "dep:futures", "dep:tokio"]

[dev-dependencies]
pollster = { version = "0.4.0", features = ["macro"] }
poem = { workspace = true, features = ["test"] }
serde_json = { workspace = true }
friendarazzi-sqlite = { path = "../friendarazzi-sqlite" }
friendarazzi-fakes = { path = "../friendarazzi-fakes" }
friendarazzi-filesystemstore = { path = "../friendarazzi-filesystemstore" }
friendarazzi-smtp = { path = "../friendarazzi-smtp" }
test-log = { workspace = true }
tracing-subscriber = { workspace = true }
# The restart case opens one database file from two apps, so it needs a directory that
# outlives a single `SQLiteInstance::in_temp_dir`.
tempdir = "0.3.7"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
# Only the AC-19 case needs a reactor: `lettre`'s async transport resolves the relay
# through `tokio::net`, so it cannot run on `pollster`.
tokio = { workspace = true, features = ["rt", "macros"] }

[lints]
workspace = true

[[bin]]
name = "export_spec"
required-features = ["openapi"]

# The suite imports `friendarazzi_api::openapi_service`, which only exists with the feature;
# without this the test target breaks `--no-default-features --all-targets`.
[[test]]
name = "e2e"
path = "tests/e2e/main.rs"
required-features = ["openapi"]
