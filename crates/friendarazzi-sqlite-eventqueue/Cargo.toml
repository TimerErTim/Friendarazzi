[package]
name = "friendarazzi-sqlite-eventqueue"
description = "Persistent SQLite-backed EventQueue adapter for friendarazzi.app"
version.workspace = true
edition.workspace = true
authors.workspace = true
license-file.workspace = true
repository.workspace = true

[dependencies]
friendarazzi-core = { path = "../friendarazzi-core" }
friendarazzi-sqlite = { path = "../friendarazzi-sqlite" }
molting = { path = "../molting" }

async-trait = { workspace = true }
chrono = { workspace = true, features = ["serde"] }
error-stack = { workspace = true }
futures = { workspace = true }
libsql = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["sync", "time"] }
tracing = { workspace = true }
uuid = { workspace = true, features = ["v4"] }

[dev-dependencies]
friendarazzi-fakes = { path = "../friendarazzi-fakes" }
tempdir = "0.3.7"
test-log = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "time", "sync"] }
tracing-subscriber = { workspace = true }

[lints]
workspace = true
