name: Feature request
description: Propose a new feature or improvement for Friendarazzi
labels: ["type: feature"]
body:
  - type: textarea
    id: idea
    attributes:
      label: Idea & Motivation
      description: What problem does this solve or what fun does it add to a game?
    validations:
      required: true
  - type: textarea
    id: details
    attributes:
      label: Suggested behavior
      description: How should it work from a player's point of view?
