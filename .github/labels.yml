# Source of truth for repository labels. Synced by .github/workflows/labels.yml.

- name: "type: feature"
  color: "1d76db"
  description: "New user-visible capability"
- name: "type: bug"
  color: "d73a4a"
  description: "Bug report or unexpected behavior"
- name: "type: chore"
  color: "ededed"
  description: "Maintenance, tooling, or refactoring"

- name: "area: backend"
  color: "bfdadc"
  description: "Rust core, API, persistence, server"
- name: "area: frontend"
  color: "bfd4f2"
  description: "Next.js static-export frontend"
- name: "area: infra"
  color: "d4c5f9"
  description: "CI, tooling, Docker, deployment"
