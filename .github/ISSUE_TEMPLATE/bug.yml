name: Bug report
description: Report broken behavior in Friendarazzi
labels: ["type: bug"]
body:
  - type: textarea
    id: actual
    attributes:
      label: What happens
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. …
        2. …
    validations:
      required: true
