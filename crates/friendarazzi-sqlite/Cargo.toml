[package]
name = "friendarazzi-sqlite"
version.workspace = true
edition.workspace = true
authors.workspace = true
license-file.workspace = true
repository.workspace = true

[dependencies]
friendarazzi-core = { path = "../friendarazzi-core" }
molting = { path = "../molting" }

async-trait = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }

thiserror = { workspace = true }
error-stack = { workspace = true }

libsql = { workspace = true }
chrono = { workspace = true, features = ["serde"] }
uuid = { workspace = true, features = ["v4", "serde"] }
rustc-hash = { workspace = true }

tempdir = "0.3.7"
async-lock = "3.4.2"

tracing = { workspace = true }
futures = { workspace = true, optional = true }
tokio = { workspace = true, features = ["sync", "time", "rt"], optional = true }

[features]
default = []
event-queue = ["dep:tokio", "dep:futures"]

[dev-dependencies]
futures = { workspace = true }
pollster = { version = "0.4.0", features = ["macro"] }
bon = { workspace = true }
friendarazzi-fakes = { path = "../friendarazzi-fakes" }
test-log = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "time", "sync"] }
tracing-subscriber = { workspace = true }

[lints]
workspace = true
